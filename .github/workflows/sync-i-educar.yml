name: Sync i-Educar upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: sync-i-educar-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: i-Educar
          repositories: i-educar

      - name: Clone upstream
        run: |
          set -euo pipefail

          git clone --mirror \
            https://github.com/portabilis/i-educar.git \
            upstream.git

      - name: Sync upstream branches and tags
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          cd upstream.git

          DEST="https://x-access-token:${MIRROR_TOKEN}@github.com/i-Educar/i-educar.git"

          # Publish every upstream branch under upstream/*
          for ref in $(git for-each-ref --format='%(refname:strip=2)' refs/heads/); do
            git push --force "$DEST" \
              "refs/heads/$ref:refs/heads/upstream/$ref"
          done

          # Keep tags synchronized
          git push --force "$DEST" \
            '+refs/tags/*:refs/tags/*'

          # Remove stale upstream/* branches
          remote_branches=$(
            git ls-remote --heads "$DEST" 'refs/heads/upstream/*' |
            sed 's#.*refs/heads/upstream/##'
          )

          for branch in $remote_branches; do
            if ! git show-ref --verify --quiet "refs/heads/$branch"; then
              git push "$DEST" \
                --delete "upstream/$branch"
            fi
          done
